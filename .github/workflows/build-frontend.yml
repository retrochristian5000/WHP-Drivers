name: WHP-Drivers frontend and host tests

on:
  push:
    paths:
      - build.sh
      - build
      - tests/build-menuconfig.sh
      - tests/test_ndis31_*.py
      - tests/test_vxd_format.py
      - tools/audit_ndis31_*.py
      - tools/check_ndis31_llvm.py
      - packaging/win95rtm/*.INF
      - tools/verify_*_inf.py
      - tests/test_*_inf.py
      - drivers/bus/pci95/**
      - drivers/audio/hda/**
      - tests/hda-probe.c
      - tests/hda-water-header.c
      - tests/win95-hda-vxd-header.c
      - third_party/water
      - tests/pci95-bridge.c
      - drivers/network/rtl8111e/identity.c
      - drivers/network/rtl8111e/rtl8111e.h
      - tests/rtl8111e-pci-snapshot.c
      - tools/dos/**
      - tools/verify_dos_mz.py
      - tests/pci95-bios-read.c
      - tests/test_dos_mz.py
  pull_request:
    paths:
      - build.sh
      - build
      - tests/build-menuconfig.sh
      - tests/test_ndis31_*.py
      - tests/test_vxd_format.py
      - tools/audit_ndis31_*.py
      - tools/check_ndis31_llvm.py
      - packaging/win95rtm/*.INF
      - tools/verify_*_inf.py
      - tests/test_*_inf.py
      - drivers/bus/pci95/**
      - drivers/audio/hda/**
      - tests/hda-probe.c
      - tests/hda-water-header.c
      - tests/win95-hda-vxd-header.c
      - third_party/water
      - tests/pci95-bridge.c
      - drivers/network/rtl8111e/identity.c
      - drivers/network/rtl8111e/rtl8111e.h
      - tests/rtl8111e-pci-snapshot.c
      - tools/dos/**
      - tools/verify_dos_mz.py
      - tests/pci95-bios-read.c
      - tests/test_dos_mz.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Portable build dispatcher
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          persist-credentials: false
      - name: Shell syntax
        run: |
          sh -n ./build.sh
          sh -n ./build
          test -x ./build
          sh -n ./tests/build-menuconfig.sh
      - name: Mocked workflow regression
        run: sh ./build.sh test-menuconfig
      - name: Fast format and NDIS fixture regressions
        run: |
          WHP_DRIVER_PROFILE=abi sh ./build.sh test-fast
          WHP_DRIVER_PROFILE=radeon6410d sh ./build.sh test-fast
          WHP_DRIVER_PROFILE=rtl8111e sh ./build.sh test-fast
          WHP_DRIVER_PROFILE=dos-pci sh ./build.sh test-fast
          WHP_DRIVER_PROFILE=hda sh ./build.sh test-fast
      - name: Pinned Water HDA header contract (header-only fetch)
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(git rev-parse HEAD:third_party/water)"
          [[ "$pinned" =~ ^[0-9a-f]{40}$ ]]
          upstream="$(git config -f .gitmodules --get submodule.third_party/water.url)"
          [ "$upstream" = "https://github.com/retrochristian5000/water.git" ]
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/ddk/win95rtm/audio"
          curl --fail --silent --show-error --location \
               --retry 2 --connect-timeout 10 --max-time 30 \
               "https://raw.githubusercontent.com/retrochristian5000/water/$pinned/include/ddk/win95rtm/audio/hda_regs.h" \
               -o "$tmp/ddk/win95rtm/audio/hda_regs.h"
          cc -std=c11 -Wall -Wextra -Werror \
             -DWHP_HDA_WATER_STANDALONE \
             -I"$tmp" -Idrivers/audio/hda \
             drivers/audio/hda/hda_probe.c tests/hda-water-header.c \
             -o "$tmp/hda-water-contract"
          "$tmp/hda-water-contract"
