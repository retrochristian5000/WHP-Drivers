name: Brother MFC-290C USB and macOS print-stack audit

on:
  push:
    paths:
      - 'drivers/usb/brother/**'
      - 'tools/macos/mfc290c*'
      - 'tools/probe/**'
      - 'tests/probe-scope.c'
      - 'tests/brother-mfc290c*.c'
      - 'tests/build-menuconfig.sh'
      - 'documentation/brother-mfc290c.md'
      - 'build'
      - 'build.sh'
      - '.github/workflows/mfc290c-identity.yml'
  pull_request:
    paths:
      - 'drivers/usb/brother/**'
      - 'tools/macos/mfc290c*'
      - 'tools/probe/**'
      - 'tests/probe-scope.c'
      - 'tests/brother-mfc290c*.c'
      - 'tests/build-menuconfig.sh'
      - 'documentation/brother-mfc290c.md'
      - 'build'
      - 'build.sh'
      - '.github/workflows/mfc290c-identity.yml'

permissions:
  contents: read

jobs:
  identity:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate portable shell syntax and profile dispatch
        run: |
          sh -n build build.sh tests/build-menuconfig.sh
          ./build.sh test-menuconfig
      - name: Test USB identity, CUPS, location and fax policy guards
        run: ./build test-brother-mfc290c
      - name: Compile and verify arm64 plus x86_64 macOS observer slices
        if: runner.os == 'macOS'
        env:
          WHP_MFC290C_MACOS_ARCH: universal2
        run: ./build build-brother-mfc290c-macos
      - name: Verify Apple Silicon process ISA without USB access
        if: runner.os == 'macOS'
        run: |
          ./.build/brother-mfc290c-macos/mfc290c-probe --architecture-only | grep -q 'processISA=arm64 '
          if WHP_MFC290C_MACOS_ARCH=arm64e ./build build-brother-mfc290c-macos; then
            printf '%s\n' 'Unsupported arm64e mode was accepted' >&2
            exit 1
          fi
      - name: Smoke macOS registry and CUPS queue observations (printer not required)
        if: runner.os == 'macOS'
        run: ./.build/brother-mfc290c-macos/mfc290c-probe
      - name: Verify location hint is optional and malformed hints fail
        if: runner.os == 'macOS'
        run: |
          ./.build/brother-mfc290c-macos/mfc290c-probe --location-hint 0x00120000
          if ./.build/brother-mfc290c-macos/mfc290c-probe --location-hint 0x0012000; then
            printf '%s\n' 'Malformed location hint unexpectedly accepted' >&2
            exit 1
          fi
