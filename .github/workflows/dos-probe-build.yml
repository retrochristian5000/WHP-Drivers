name: WHP-Drivers DOS probe source build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dos-probe-build.yml
      - .gitmodules
      - build
      - build.sh
      - toolchains/openwatcom
      - tools/dos/**
      - tools/probe/**
      - tools/verify_dos_mz.py
      - tools/package_dos_probe.py
      - drivers/bus/pci95/**
      - drivers/network/rtl8111e/identity.c
      - drivers/network/rtl8111e/rtl8111e.h
      - drivers/storage/fch_sata/**
      - drivers/usb/**
      - tests/dos-*.c
      - tests/test_dos_*.py
      - tests/pci*.c
      - tests/probe-menu.c
      - tests/probe-scope.c
      - tests/rtl8111e-pci-snapshot.c
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whp-dos-probe-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  dos-probe:
    name: Compile and package 16-bit WHPPROBE.EXE
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout source without persisted token
        uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Record initial runner capacity
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'WHP-Drivers: runner CPU count'
          nproc
          printf '%s\n' 'WHP-Drivers: available disk'
          df -h .
          printf '%s\n' 'WHP-Drivers: initial memory snapshot (not peak usage)'
          free -h

      - name: Validate portable scripts and archive tests
        shell: bash
        run: |
          set -euo pipefail
          sh -n ./build ./build.sh
          python3 -m unittest discover -s tests -p 'test_dos_packages.py'

      - name: Fetch precisely pinned OpenWatcom source
        id: watcom_source
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 -- toolchains/openwatcom
          pinned="$(git rev-parse HEAD:toolchains/openwatcom)"
          actual="$(git -C toolchains/openwatcom rev-parse HEAD)"
          test "$actual" = "$pinned"
          printf 'WHP-Drivers: pinned OpenWatcom %s\n' "$pinned"
          printf 'revision=%s\n' "$pinned" >> "$GITHUB_OUTPUT"

      - name: Verify native bootstrap prerequisites and compiler identity
        id: host
        shell: bash
        run: |
          set -euo pipefail
          for tool in clang make cc c++ git python3 sha256sum; do
            command -v "$tool" >/dev/null
          done
          clang_path="$(command -v clang)"
          clang_hash="$(
            {
              printf '%s\n' "$clang_path"
              "$clang_path" --version
              "$clang_path" -dumpmachine
            } | sha256sum | cut -d' ' -f1
          )"
          printf 'clang_hash=%s\n' "$clang_hash" >> "$GITHUB_OUTPUT"
          printf 'WHP-Drivers: host Clang fingerprint %s\n' "$clang_hash"

      # Only release artifacts needed for real-mode DOS compilation are
      # cached. No source checkout, intermediate objects, DOS EXE or archive
      # is reused. The key is exact: no stale-revision restore prefixes.
      - name: Restore pinned OpenWatcom DOS release cache
        id: watcom_cache
        uses: actions/cache/restore@v5
        with:
          path: |
            toolchains/openwatcom/rel/binl64
            toolchains/openwatcom/rel/h
            toolchains/openwatcom/rel/lib286
          key: ow-dos-rel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watcom_source.outputs.revision }}-${{ steps.host.outputs.clang_hash }}

      - name: Build pinned OpenWatcom from source on cache miss
        if: steps.watcom_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          WHP_WATCOM_CLANG="$(command -v clang)" sh ./build.sh bootstrap-watcom

      - name: Check restored or rebuilt OpenWatcom release
        shell: bash
        run: |
          set -euo pipefail
          release=toolchains/openwatcom/rel
          for dir in "$release" "$release/binl64" "$release/h" "$release/lib286" "$release/lib286/dos"; do
            test -d "$dir"
            test ! -L "$dir"
          done
          for tool in wcc wcc386 wlink; do
            test -x "$release/binl64/$tool"
            test ! -L "$release/binl64/$tool"
          done
          sh ./build watcom-check

      - name: Run DOS synthetic tests and link WHPPROBE.EXE
        shell: bash
        run: |
          set -euo pipefail
          WHP_DRIVER_PROFILE=dos-probe WHP_DRIVER_BOOTSTRAP=off sh ./build.sh test-fast
          sh ./build dos-probe-build
          test -s .build/dos-pci/WHPPROBE.EXE
          python3 tools/verify_dos_mz.py .build/dos-pci/WHPPROBE.EXE

      # Save only after actual WHPPROBE compilation, DOS linking and MZ
      # validation succeed. A failed or partial bootstrap is never cached.
      - name: Cache validated OpenWatcom DOS release
        if: steps.watcom_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            toolchains/openwatcom/rel/binl64
            toolchains/openwatcom/rel/h
            toolchains/openwatcom/rel/lib286
          key: ow-dos-rel-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.watcom_source.outputs.revision }}-${{ steps.host.outputs.clang_hash }}

      - name: Create and inspect TGZ and ZIP packages
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 tools/package_dos_probe.py --exe .build/dos-pci/WHPPROBE.EXE --output-dir .build/dos-packages --source-sha "$(git rev-parse HEAD)" --watcom-sha "$(git rev-parse HEAD:toolchains/openwatcom)"
          cd .build/dos-packages
          sha256sum --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.tgz' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -type f -name '*.zip' | wc -l)" -eq 1

      - name: Upload DOS packages (not a driver installation)
        uses: actions/upload-artifact@v6
        with:
          name: whpprobe-dos-${{ github.sha }}
          path: |
            .build/dos-packages/*.tgz
            .build/dos-packages/*.zip
            .build/dos-packages/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # Diagnostic only: do not start an additional build or hide
      # earlier compiler/linker failures with a successful summary.
      - name: Report DOS CI resource usage
        if: always()
        shell: bash
        env:
          WHP_CACHE_HIT: ${{ steps.watcom_cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          {
            printf '### WHPPROBE CI resource snapshot\n\n'
            printf 'OpenWatcom cache hit: %s\n\n' "$WHP_CACHE_HIT"
            printf 'Remaining runner disk:\n\n'
            printf '~~~text\n'
            df -h . || printf '%s\n' 'Disk metric unavailable'
            printf '~~~\n\n'
            printf 'Memory snapshot (not peak usage):\n\n'
            printf '~~~text\n'
            free -h || printf '%s\n' 'Memory metric unavailable'
            printf '~~~\n\n'
            printf 'Relevant workspace sizes:\n\n'
            printf '~~~text\n'
            for path in toolchains/openwatcom/rel/binl64 \
                        toolchains/openwatcom/rel/h \
                        toolchains/openwatcom/rel/lib286 \
                        .build/dos-pci .build/dos-packages; do
              if [ -e "$path" ]; then
                du -sh "$path" || printf 'Could not measure %s\n' "$path"
              else
                printf 'Not present: %s\n' "$path"
              fi
            done
            printf '~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"
